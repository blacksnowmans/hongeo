<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hongeo_home</title>
<meta name="description" content="홍어와 집사의 찐찐 사용템">
<meta name="robots" content="noindex">
<meta property="og:title" content="hongeo_home">
<meta property="og:description" content="홍어와 집사의 찐찐 사용템">
<meta property="og:image" content="avatar.jpg">
<style>
  :root { --bg: #ffe3c2; --ink: #1f1f1f; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .ticker { background: #2b2b2b; color: #fff; font-size: 13px; font-weight: bold; overflow: hidden; white-space: nowrap; padding: 6px 0; }
  .ticker span { display: inline-block; padding-left: 100%; animation: slide 16s linear infinite; }
  @keyframes slide { to { transform: translateX(-100%); } }
  main { max-width: 440px; margin: 0 auto; padding: 32px 16px 40px; }
  .profile { text-align: center; margin-bottom: 26px; }
  .profile img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
  .profile h1 { font-size: 17px; margin: 10px 0 6px; }
  .profile p { margin: 0; font-size: 13px; }
  .list { display: grid; gap: 14px; }
  .list a {
    position: relative; display: flex; align-items: center; justify-content: center;
    min-height: 66px; padding: 8px 16px 8px 80px; background: #fff; color: var(--ink);
    border: 2px solid var(--ink); border-radius: 10px; box-shadow: 4px 4px 0 var(--ink);
    text-decoration: none; text-align: center; font-size: 14px; font-weight: 600; line-height: 1.45;
    transition: transform .08s, box-shadow .08s;
  }
  .list a:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .list a img { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 58px; height: 58px; border-radius: 6px; object-fit: cover; }
  .list a.noimg { padding-left: 16px; }
  .sns { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
  .sns a { color: var(--ink); }
  .sns svg { width: 24px; height: 24px; display: block; }
</style>
</head>
<body>
<div class="ticker"><span>이 페이지의 상품 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</span></div>
<main>
  <section class="profile">
    <img src="avatar.jpg" alt="홍어">
    <h1>hongeo_home</h1>
    <p>홍어와 집사의 찐찐 사용템</p>
  </section>

  <nav class="list" id="list"></nav>

  <div class="sns">
    <a href="https://www.instagram.com/hongeo_home/" target="_blank" rel="noopener" aria-label="인스타그램">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></a>
    <a href="https://www.youtube.com/@hongeo_home" target="_blank" rel="noopener" aria-label="유튜브">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15.1V8.9L15.5 12z"/></svg></a>
  </div>
</main>
<script>
  // ── 여기만 고치면 됩니다 ─────────────────────────────────────────
  // img 를 비우면 글자만 있는 버튼. url 을 비우면 쿠팡 스토어로 연결.
  const STORE = "https://influencers.coupang.com/s/hongeo_home";
  const LIST = [
    { img: "yt.svg", text: "홍어 유튜브", url: "https://www.youtube.com/@hongeo_home" },
    { img: "p1.jpg", text: "홍어가 제일 잘 먹는\n동결건조 닭가슴살 간식", url: "https://www.coupang.com/vp/products/9689625828?itemId=28979323948&vendorItemId=95908677347&src=1139000&spec=10799999&addtag=400&ctag=9689625828&lptag=AF5038469&pageType=PRODUCT&pageValue=9689625828&wRef=influencers.coupang.com&redirect=landing&portal=CREATOR&sfId=1010307" },
    { img: "candy.svg", text: "집사 최애 젤리\n하리보 사운드큐브 사우어", url: "https://link.coupang.com/a/ijwcWM9Kou" },
    { img: "p2.jpg", text: "집사 추천 젤리 간식", url: "https://www.coupang.com/vp/products/6631842834?itemId=15122076778&vendorItemId=82343805562&src=1139000&spec=10799999&addtag=400&ctag=6631842834&lptag=AF5038469&pageType=PRODUCT&pageValue=6631842834&wRef=influencers.coupang.com&redirect=landing&portal=CREATOR&sfId=1010307" },
    { img: "", text: "홍어네 쿠팡 스토어 전체 보기", url: STORE },
  ];
  // ─────────────────────────────────────────────────────────────

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("list").innerHTML = LIST.map(i => {
    const url = i.url || STORE;
    const rel = url.includes("coupang") ? "noopener sponsored" : "noopener";
    return `<a href="${esc(url)}" target="_blank" rel="${rel}"${i.img ? "" : ' class="noimg"'}>` +
      (i.img ? `<img src="${esc(i.img)}" alt="" loading="lazy">` : "") +
      `<span>${esc(i.text).replace(/\n/g, "<br>")}</span></a>`;
  }).join("");
</script>
</body>
</html>
